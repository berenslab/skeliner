[workspace]
members = ["meshcore", "skeliner-pre", "skeliner-py"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
meshcore = { path = "meshcore" }
skeliner-pre = { path = "skeliner-pre" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
# Cargo's default debuginfo strip runs the system `strip`; on macOS 27 with the
# current Command Line Tools its output is refused by dyld ("mis-aligned
# LINKEDIT string pool"), so release builds keep their symbols.
strip = "none"
