[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "skeliner"
version = "0.3.1"
description = "A lightweight neuromorphological mesh skeletonizer."
authors = []
requires-python = ">=3.11.0"
dependencies = [
    "igraph>=0.11.8",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "trimesh==4.7.4",
    "rtree>=1.4.1",
    "shapely>=2.1.2",
    "matplotlib>=3.10.3",
    "starlette>=0.52.1",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.22",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "ruff",
    "flake8>=7.3.0",
    "httpx2>=2.0.0",
    "watermark>=2.5.0",
]

[project.scripts]
skeliner = "skeliner.__main__:main"

[tool.maturin]
# The Rust path is the `skeliner._rs` extension module, built from the
# workspace in skeliner/rust/ (one crate per Python module) and installed
# inside the `skeliner` package. Wheels carry the module, not its sources.
manifest-path = "skeliner/rust/_rs/Cargo.toml"
module-name = "skeliner._rs"
exclude = [{ path = "skeliner/rust/**/*", format = "wheel" }]

[tool.uv]
# Rebuild the extension on `uv sync` when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "skeliner/rust/**/Cargo.toml" },
    { file = "skeliner/rust/**/*.rs" },
]

[tool.ruff]
line-length = 88
# Notebooks are the user's own; no tool of ours rewrites them.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# ruff's defaults (E4/E7/E9, F) plus unused arguments — a parameter that
# is never read is usually a leftover from a rename.  Framework-mandated
# signatures keep theirs under an underscore, which ARG skips.
select = ["E4", "E7", "E9", "F", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
