# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - name: rustfmt
              working-directory: skeliner/rust
              run: cargo fmt --all --check
            - name: clippy
              working-directory: skeliner/rust
              run: cargo clippy --workspace --all-targets -- -D warnings
            - name: cargo test
              working-directory: skeliner/rust
              # _rs is the extension module; pytest covers it.
              run: cargo test --workspace --exclude _rs

    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Install dependencies
              # Editable, so maturin builds the Rust extension into skeliner/:
              # tests/ is a package, so pytest puts the repo root first on
              # sys.path and imports skeliner from the checkout, not from
              # site-packages.
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install flake8 pytest
                  python -m pip install -e .[dev]
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            - name: Lint with flake8
              run: |
                  # stop the build if there are Python syntax errors or undefined names
                  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                  # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
                  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            - name: Test with pytest
              run: |
                  pytest

    macos:
        # Apple silicon: the platform the Python and Rust paths were checked
        # on, where tests/_parity.py compares them exactly.
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .[dev]
            - name: Test with pytest
              run: |
                  pytest
